name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        
    - name: Create gradle wrapper folder
      run: mkdir -p gradle/wrapper
      
    - name: Download gradle-wrapper.jar via curl
      run: curl -L -o gradle/wrapper/gradle-wrapper.jar https://repo1.maven.org/maven2/org/gradle/wrapper/gradle-wrapper/8.10.2/gradle-wrapper-8.10.2.jar
      
    - name: Create gradle-wrapper.properties
      run: echo -e "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.10.2-bin.zip\nnetworkTimeout=10000\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists" > gradle/wrapper/gradle-wrapper.properties
      
    - name: Create gradlew script
      run: |
        echo '#!/bin/sh' > gradlew
        echo 'exec java -jar gradle/wrapper/gradle-wrapper.jar "$@"' >> gradlew
        chmod +x gradlew
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build APK
      run: ./gradlew assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: IK-Antivirus
        path: app/build/outputs/apk/debug/app-debug.apk
