name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # Мы полностью отказываемся от возни с gradle-wrapper. 
    # Скачиваем совместимую версию Gradle (8.0.2) напрямую, без всяких обёрток.
    - name: Download Gradle 8.0.2
      run: wget https://services.gradle.org/distributions/gradle-8.0.2-bin.zip && unzip gradle-8.0.2-bin.zip

    # Запускаем сборку через скачанный Gradle (папка gradle-8.0.2/bin/)
    - name: Build APK
      run: ./gradle-8.0.2/bin/gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: IK-Antivirus
        path: app/build/outputs/apk/debug/app-debug.apk
